[package]
name = "tn-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tn-types = { path = "../tn-types" }
tn-crypto = { path = "../tn-crypto" }
tn-oplog = { path = "../tn-oplog" }
tn-merkle = { path = "../tn-merkle" }
tn-tlog = { path = "../tn-tlog" }
tn-proto = { path = "../tn-proto" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.16"
