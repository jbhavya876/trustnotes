[package]
name = "tn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tn"
path = "src/main.rs"

[dependencies]
tn-types = { path = "../tn-types" }
tn-crypto = { path = "../tn-crypto" }
tn-oplog = { path = "../tn-oplog" }
tn-merkle = { path = "../tn-merkle" }
tn-tlog = { path = "../tn-tlog" }
tn-proto = { path = "../tn-proto" }
tn-core = { path = "../tn-core" }
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.16"
assert_cmd = "2.0"
predicates = "3.1"
