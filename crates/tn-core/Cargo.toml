[package]
name = "tn-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tn-types = { path = "../tn-types" }
tn-crypto = { path = "../tn-crypto" }
tn-oplog = { path = "../tn-oplog" }
tn-merkle = { path = "../tn-merkle" }
tn-tlog = { path = "../tn-tlog" }
tn-proto = { path = "../tn-proto" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ciborium = "0.2"
zeroize = "1.8"
getrandom = "0.2"
hex = "0.4"

[dev-dependencies]
tempfile = "3.16"
proptest = "1.6"
sha2 = "0.10"
tn-server = { path = "../tn-server" }
tn-monitor = { path = "../tn-monitor" }
