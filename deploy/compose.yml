# TrustNotes development infrastructure
# Usage: docker compose -f deploy/compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trustnotes_dev
      POSTGRES_USER: trustnotes
      POSTGRES_PASSWORD: trustnotes_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustnotes -d trustnotes_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trustnotes
      MINIO_ROOT_PASSWORD: trustnotes_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Witness processes — enabled in M3
  # witness1:
  #   image: trustnotes/tn-witness:dev
  #   ...

volumes:
  postgres_data:
  minio_data:
